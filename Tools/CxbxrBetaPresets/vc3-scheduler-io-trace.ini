[beta]
; Low-volume, record-atomic Windows/Android comparison preset for the VC3
; CRI/Sofdec worker. This traces only guest waits, thread suspend/resume state,
; thread creation, and NtReadFile calls.
full_trace=0
scheduler_io_trace=1
; VC3 CRI server dispatcher phase: 0=idle, 1/2/5/6=active stage.
scheduler_io_probe_address=0x004BA9F0
; File-open/read comparison is intentionally low volume. The full scheduler
; churn trace can exceed hundreds of MB and perturb Android timing.
scheduler_io_wait_trace=0
scheduler_io_thread_trace=0
scheduler_io_event_trace=0
scheduler_io_file_trace=1
scheduler_io_cri_watch_base=0x005092C0
scheduler_io_cri_watch_stride=340
scheduler_io_cri_watch_count=40

; Preserve the current best VC3 kernel baseline.
apc_try_lock=0
satisfy_wait_apc_flags=1
; Keep the broad wait-object recheck disabled because it interferes with the
; emulator's type-5 suspended-thread startup semaphore under Wine.
wait_list_toctou_recheck=0
; Android/Wine can signal the shared video-worker notification event between
; the initial SignalState check and wait-list insertion. Recheck type-0
; notification events only so that wakeup cannot be lost.
notification_event_wait_recheck=1
; Wine/Box32 can lose a resume when an Xbox thread suspends itself twice
; around a frame boundary. Use an emulator-owned auto-reset event for
; self-suspends while retaining native suspension for external busy loops.
cooperative_self_suspend=1
timer_try_lock=0

precise_sleep_timer=0
periodic_irq10=0
llong_min_timeout_fix=1
llong_min_timeout_sleep_ms=0
get_now_lock=0
atomic_interrupts=0
system_events_other_affinity=0
system_events_normal_priority=0

timer_exp_pointer_guard=0
timer_exp_max_expired=0
timer_exp_max_ticks=0

mb_board_type=0
mb_dimm_size=0
