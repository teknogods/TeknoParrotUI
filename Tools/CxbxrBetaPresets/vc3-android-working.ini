scheduler_io_trace=0
scheduler_io_probe_address=0
scheduler_io_wait_trace=0
scheduler_io_thread_trace=0
scheduler_io_event_trace=0
scheduler_io_file_trace=0
scheduler_io_cri_watch_base=0
scheduler_io_cri_watch_stride=340
scheduler_io_cri_watch_count=0

