[beta]
; Virtua Cop 3 Android production profile.
;
; Wine/Box32 can otherwise lose one of the rapid resume operations used by
; VC3's CRI/Sofdec worker, leaving the worker natively suspended while the
; guest suspend count says it is runnable. Cooperative self-suspension keeps
; that transition inside the emulator. The narrow notification-event recheck
; closes the adjacent signal-before-wait race.
