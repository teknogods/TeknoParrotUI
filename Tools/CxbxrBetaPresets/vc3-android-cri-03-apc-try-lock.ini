[beta]
; VC3 CRI isolation step 3: step 2 plus the non-blocking APC list lock.
; This prevents Wine/Box86 worker contention from blocking APC insertion or
; execution while CRI waits indefinitely for its decoder wake-up.
apc_try_lock=1
satisfy_wait_apc_flags=1
wait_list_toctou_recheck=0
timer_try_lock=0

precise_sleep_timer=0
periodic_irq10=0
llong_min_timeout_fix=1
llong_min_timeout_sleep_ms=0
get_now_lock=0
atomic_interrupts=0
system_events_other_affinity=0
system_events_normal_priority=0

timer_exp_pointer_guard=0
timer_exp_max_expired=0
timer_exp_max_ticks=0

mb_board_type=0
mb_dimm_size=0
