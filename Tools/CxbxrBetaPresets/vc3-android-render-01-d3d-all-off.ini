[beta]
; VC3 CRI/Sofdec isolation: keep only the INT64_MIN zero-delay wait fix
; needed to leave the title screen, while disabling every optional D3D
; optimization. Sofdec updates a persistent movie texture in place, so stale
; binding and staging caches must be ruled out before changing decoder logic.
apc_try_lock=0
satisfy_wait_apc_flags=0
wait_list_toctou_recheck=0
timer_try_lock=0

precise_sleep_timer=0
periodic_irq10=0
llong_min_timeout_fix=1
llong_min_timeout_sleep_ms=0
get_now_lock=0
atomic_interrupts=0
system_events_other_affinity=0
system_events_normal_priority=0

timer_exp_pointer_guard=0
timer_exp_max_expired=0
timer_exp_max_ticks=0

rt_texture_alias=0
default_transparent_tex=0
rt_resolve_self_sampling=0
vsh_constant_delta_upload=0
staging_surface_pool=0
texture_stage_cache=0

mb_board_type=0
mb_dimm_size=0
