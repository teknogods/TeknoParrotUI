[beta]
; Exact Windows/Android comparison preset for VC3 CRI/Sofdec diagnosis.
; full_trace enables timestamped all-module function logging plus the existing
; performance and render traces. It is intentionally unsuitable for normal play.
full_trace=1

; Preserve the best current VC3 kernel baseline: model INT64_MIN as an
; infinite alertable wait and allow WaitApc to observe pending APC flags.
apc_try_lock=0
satisfy_wait_apc_flags=1
wait_list_toctou_recheck=0
timer_try_lock=0

precise_sleep_timer=0
periodic_irq10=0
llong_min_timeout_fix=1
llong_min_timeout_sleep_ms=0
get_now_lock=0
atomic_interrupts=0
system_events_other_affinity=0
system_events_normal_priority=0

timer_exp_pointer_guard=0
timer_exp_max_expired=0
timer_exp_max_ticks=0

mb_board_type=0
mb_dimm_size=0
